name: Deploy to Vercel

on:
  push:
    branches:
      - release.v.0.1

permissions:
  contents: read

concurrency:
  group: vercel-production
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest

    env:
      VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
      VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
      VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Configure and check Git email
        env:
          EXPECTED_GIT_EMAIL: szuryanailham090102@gmail.com
        run: |
          git config --local user.email "$EXPECTED_GIT_EMAIL"
          author_email="$(git log -1 --format=%ae)"
          if [ "$author_email" != "$EXPECTED_GIT_EMAIL" ]; then
            echo "::error::Email author commit tidak sesuai. Atur git config user.email menjadi $EXPECTED_GIT_EMAIL di komputer lokal, lalu buat dan push commit baru."
            exit 1
          fi

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Install Vercel CLI
        run: npm install --global vercel@latest

      - name: Deploy production
        run: vercel deploy --prod --yes --token="$VERCEL_TOKEN"
